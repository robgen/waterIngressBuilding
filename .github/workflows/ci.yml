name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10, 3.11]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: |
          # prefer pytest when available
          if command -v pytest >/dev/null 2>&1; then
            pytest -q
          else
            python3 tests/run_tests.py
          fi

      - name: Run example (smoke test)
        run: |
          # Run a short, fast smoke example to validate end-to-end behavior.
          # Use a coarse timestep and do not generate animation to keep CI fast.
          python3 main.py --external example_run/example_external_levels.csv \
            --ingress example_run/example_ingress_paths.txt --dt 60 \
            --outdir example_run_ci
            --temp-output

      - name: Upload example outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-run-outputs
          path: example_run_ci/**

      - name: Upload test logs (if any)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-logs
          path: ./
