name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: pytest -q

      - name: Run examples (smoke test)
        run: |
          # Single run and batch run end to end; no animation to keep CI fast.
          python3 cli.py --external examples/ex01/hydro.csv \
            --ingress examples/ex01/ingress.csv --floor 50 --dt 1 \
            --outdir ci_outputs/cli
          python3 batch.py --depth-dir examples/shared/batch_hydros \
            --ingress examples/ex01/ingress.csv --floor 50 --dt 1 \
            --outdir ci_outputs/batch

      - name: Upload example outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-run-outputs
          path: ci_outputs/**

      - name: Upload test logs (if any)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-logs
          path: ./
